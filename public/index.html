<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>☀️ Weather Dashboard</h1>
            <p class="subtitle">Real-time weather information at your fingertips</p>
        </header>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search city or coordinates (lat,lon)..."
                    class="search-input"
                >
                <button id="searchBtn" class="search-btn">
                    <i class="fas fa-search"></i> Search
                </button>
                <button id="locationBtn" class="location-btn" title="Use current location">
                    <i class="fas fa-map-marker-alt"></i>
                </button>
            </div>
            <div class="quick-cities">
                <span class="quick-label">Quick access:</span>
                <button class="quick-city-btn" data-city="London">London</button>
                <button class="quick-city-btn" data-city="New York">New York</button>
                <button class="quick-city-btn" data-city="Tokyo">Tokyo</button>
                <button class="quick-city-btn" data-city="Paris">Paris</button>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="loading-spinner hidden">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="error-message hidden"></div>

        <!-- Main Weather Display -->
        <div id="weatherContainer" class="weather-container hidden">
            <!-- Current Weather -->
            <div class="current-weather">
                <div class="location-info">
                    <h2 id="cityName" class="city-name"></h2>
                    <p id="datetime" class="datetime"></p>
                </div>
                <div class="weather-main">
                    <div class="temperature-section">
                        <img id="weatherIcon" src="" alt="Weather icon" class="weather-icon">
                        <div class="temp-display">
                            <span id="temperature" class="temperature"></span>
                            <span id="weatherDescription" class="weather-description"></span>
                        </div>
                    </div>
                    <div class="weather-details">
                        <div class="detail-item">
                            <i class="fas fa-tint"></i>
                            <div>
                                <span class="detail-label">Humidity</span>
                                <span id="humidity" class="detail-value"></span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-wind"></i>
                            <div>
                                <span class="detail-label">Wind Speed</span>
                                <span id="windSpeed" class="detail-value"></span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-compress-alt"></i>
                            <div>
                                <span class="detail-label">Pressure</span>
                                <span id="pressure" class="detail-value"></span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-eye"></i>
                            <div>
                                <span class="detail-label">Visibility</span>
                                <span id="visibility" class="detail-value"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 5-Day Forecast -->
            <div class="forecast-section">
                <h3 class="section-title">5-Day Forecast</h3>
                <div id="forecastContainer" class="forecast-grid"></div>
            </div>

            <!-- Hourly Forecast -->
            <div class="hourly-section">
                <h3 class="section-title">Hourly Forecast (Next 24 Hours)</h3>
                <div id="hourlyContainer" class="hourly-grid"></div>
            </div>
        </div>

        <!-- Welcome Screen -->
        <div id="welcomeScreen" class="welcome-screen">
            <div class="welcome-content">
                <i class="fas fa-cloud-sun"></i>
                <h2>Welcome to Weather Dashboard</h2>
                <p>Search for a city or use your current location to get started</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
